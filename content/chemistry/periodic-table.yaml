exercises:
  - id: periodic-table-001
    type: choice
    difficulty: 1
    lang: text
    prompt: Kimyoviy elementlar davriy sistemasida birinchi oʻrinda qaysi element turadi?
    options:
      - Kislorod
      - Uglerod
      - Vodorod
      - Geliy
    answer: 2
    explanation: Vodorodning (H) atom raqami 1 ga teng, shuning uchun davriy sistema shu elementdan boshlanadi.
  - id: periodic-table-002
    type: choice
    difficulty: 1
    lang: text
    prompt: Uglerodning kimyoviy belgisi qaysi?
    options:
      - C
      - Ca
      - Cu
      - Cl
    answer: 0
    explanation: Uglerod C bilan belgilanadi (lotincha Carboneum); Ca — kalsiy, Cu — mis, Cl — xlorning belgisi.
  - id: periodic-table-003
    type: choice
    difficulty: 2
    lang: text
    prompt: Qaysi metall xona haroratida suyuq holatda boʻladi?
    options:
      - Temir
      - Simob
      - Mis
      - Oltin
    answer: 1
    explanation: Simob (Hg) — xona haroratida suyuq holatda boʻladigan yagona metall.
  - id: periodic-table-004
    type: choice
    difficulty: 2
    lang: text
    prompt: Kislorodning atom raqami (tartib raqami) nechaga teng?
    options:
      - "6"
      - "8"
      - "16"
      - "18"
    answer: 1
    explanation: Kislorodning atom raqami 8, yaʼni uning yadrosida 8 ta proton bor; 16 esa kislorodning nisbiy atom massasi.
  - id: periodic-table-005
    type: choice
    difficulty: 2
    lang: text
    prompt: Inert (nodir) gazlar davriy sistemaning qaysi guruhida joylashgan?
    options:
      - I guruh
      - II guruh
      - VII guruh
      - VIII guruh
    answer: 3
    explanation: Geliy, neon, argon va boshqa inert gazlar VIII guruhning bosh guruhchasida joylashgan (davriy sistemaning uzun shaklida bu 18-guruh).
  - id: periodic-table-006
    type: choice
    difficulty: 3
    lang: text
    prompt: D. I. Mendeleyev davriy qonunni nechanchi yilda kashf etgan?
    options:
      - "1869"
      - "1789"
      - "1829"
      - "1913"
    answer: 0
    explanation: Mendeleyev 1869-yilda davriy qonunni kashf etib, kimyoviy elementlarning davriy sistemasini tuzgan.
  - id: periodic-table-007
    type: choice
    difficulty: 3
    lang: text
    prompt: Natriy (Na) davriy sistemaning qaysi davri va qaysi guruhida joylashgan?
    options:
      - 2-davr, I guruh
      - 3-davr, I guruh
      - 3-davr, II guruh
      - 4-davr, I guruh
    answer: 1
    explanation: Natriyning atom raqami 11, elektronlari uch qavatda (2, 8, 1) joylashgan. Shuning uchun u 3-davrda, tashqi qavatida bitta elektron boʻlgani uchun esa I guruhda — ishqoriy metallar qatorida turadi.
  - id: periodic-table-008
    type: choice
    difficulty: 1
    lang: text
    prompt: Eng yengil gaz qaysi?
    options:
      - Azot
      - Geliy
      - Kislorod
      - Vodorod
    answer: 3
    explanation: Vodorod (H₂) — eng yengil gaz, u havodan taxminan 14,5 marta yengil; geliy yengilligi boʻyicha ikkinchi oʻrinda turadi.
  - id: periodic-table-009
    type: choice
    difficulty: 1
    lang: text
    prompt: Fe kimyoviy belgisi qaysi elementga tegishli?
    options:
      - Ftor
      - Fosfor
      - Temir
      - Fransiy
    answer: 2
    explanation: Fe — temirning belgisi, u elementning lotincha Ferrum nomidan olingan.
  - id: periodic-table-010
    type: fill
    difficulty: 1
    lang: text
    prompt: "Gapni toʻldiring:"
    code: Davriy sistemada vertikal ustunlar ___, gorizontal qatorlar esa ___ deb ataladi.
    answer:
      - guruhlar
      - davrlar
    bank:
      - izotoplar
      - molekulalar
      - qavatlar
    explanation: Davriy sistemada elementlar gorizontal davrlarga va vertikal guruhlarga joylashtirilgan.
  - id: periodic-table-011
    type: choice
    difficulty: 2
    lang: text
    prompt: Elementning davriy sistemadagi atom raqami (tartib raqami) nimani bildiradi?
    options:
      - Atom yadrosidagi protonlar sonini
      - Atom yadrosidagi neytronlar sonini
      - Atomning nisbiy massasini
      - Elektron qavatlar sonini
    answer: 0
    explanation: Atom raqami yadrodagi protonlar soniga, yaʼni yadro zaryadiga teng.
  - id: periodic-table-012
    type: choice
    difficulty: 1
    lang: text
    prompt: Kimyoviy belgisi Au boʻlgan element qaysi?
    options:
      - Kumush
      - Alyuminiy
      - Argon
      - Oltin
    answer: 3
    explanation: Au — oltinning belgisi (lotincha Aurum); kumush Ag, alyuminiy Al, argon Ar bilan belgilanadi.
  - id: periodic-table-013
    type: output
    difficulty: 1
    lang: text
    prompt: "Javobni son bilan yozing:"
    code: Kimyoviy elementlar davriy sistemasida nechta davr bor?
    answer:
      - "7"
      - 7 ta
      - yetti
      - yettita
    explanation: Davriy sistema 7 ta davrdan iborat; har bir davr yangi elektron qavatning toʻla boshlashi bilan boshlanadi.
  - id: periodic-table-014
    type: choice
    difficulty: 2
    lang: text
    prompt: Qaysi element inert (nodir) gazlar qatoriga kiradi?
    options:
      - Neon
      - Azot
      - Xlor
      - Vodorod
    answer: 0
    explanation: Neon — tashqi elektron qavati toʻlgan inert gaz, shuning uchun u deyarli reaksiyaga kirishmaydi.
  - id: periodic-table-015
    type: order
    difficulty: 2
    lang: text
    prompt: "Elementlarni atom raqami ortib borish tartibida joylashtiring:"
    lines:
      - Vodorod
      - Uglerod
      - Kislorod
      - Natriy
      - Xlor
    explanation: "Atom raqamlari: vodorod — 1, uglerod — 6, kislorod — 8, natriy — 11, xlor — 17."
  - id: periodic-table-016
    type: choice
    difficulty: 2
    lang: text
    prompt: Atom raqami 17 boʻlgan element qaysi?
    options:
      - Oltingugurt
      - Argon
      - Xlor
      - Fosfor
    answer: 2
    explanation: Xlorning atom raqami 17; fosforniki 15, oltingugurtniki 16, argonniki 18.
  - id: periodic-table-017
    type: fill
    difficulty: 2
    lang: text
    prompt: "Gapni toʻldiring:"
    code: Birinchi guruhning bosh guruhchasidagi litiy, natriy va kaliy ___ metallar deb ataladi, ftor, xlor va brom esa ___ deyiladi.
    answer:
      - ishqoriy
      - galogenlar
    bank:
      - inert
      - lantanoidlar
      - oksidlar
    explanation: Litiy, natriy, kaliy suv bilan ishqor hosil qilgani uchun ishqoriy metallar deyiladi; ftor, xlor, brom esa yettinchi guruhdagi galogenlardir.
  - id: periodic-table-018
    type: choice
    difficulty: 3
    lang: text
    prompt: Davriy sistemaning 3-davrida nechta element joylashgan?
    options:
      - "2"
      - "8"
      - "18"
      - "32"
    answer: 1
    explanation: 3-davr natriydan argongacha boʻlgan 8 ta elementni oʻz ichiga oladi.
  - id: periodic-table-019
    type: choice
    difficulty: 3
    lang: text
    prompt: Davrda chapdan oʻngga oʻtganda elementlarning metallik xossalari qanday oʻzgaradi?
    options:
      - Kuchayadi
      - Oʻzgarmaydi
      - Susayadi
      - Avval susayib, keyin kuchayadi
    answer: 2
    explanation: Davrda chapdan oʻngga yadro zaryadi ortadi va atom elektronlarini qiyinroq beradi, shuning uchun metallik xossalari susayadi.
  - id: periodic-table-020
    type: choice
    difficulty: 3
    lang: text
    prompt: Bosh guruhchada yuqoridan pastga tushganda atom radiusi qanday oʻzgaradi?
    options:
      - Kichrayadi
      - Oʻzgarmaydi
      - Avval ortib, keyin kichrayadi
      - Ortadi
    answer: 3
    explanation: Guruhda yuqoridan pastga elektron qavatlar soni ortadi, shuning uchun atom radiusi kattalashadi.
