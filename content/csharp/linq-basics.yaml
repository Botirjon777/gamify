exercises:
  - id: cs-linq-001
    type: output
    difficulty: 1
    lang: csharp
    prompt: Konsolga nima chiqadi?
    code: |-
      using System;
      using System.Linq;

      int[] numbers = { 1, 2, 3, 4, 5 };
      int count = numbers.Count(n => n > 2);
      Console.Write(count);
    answer: "3"
    explanation: Count shartga mos keladigan elementlar sonini sanaydi. 2 dan katta sonlar 3, 4, 5 (jami 3 ta).
  - id: cs-linq-002
    type: fill
    difficulty: 1
    lang: csharp
    prompt: Har bir elementni boshqa koʻrinishga oʻtkazish (transformatsiya / proyeksiyalash) uchun LINQ metodini toʻldiring.
    code: |-
      var names = new[] { "ali", "vali" };
      var upper = names.___(n => n.ToUpper());
    answer:
      - Select
    explanation: Select metodi toʻplamdagi har bir elementni yangi qiymatga oʻzgartiradi (JavaScript'dagi map ga oʻxshash).
  - id: cs-linq-003
    type: fill
    difficulty: 1
    lang: csharp
    prompt: Toʻplamdan shartga mos keluvchi elementlarni saralab (filtrlab) olish metodini toʻldiring.
    code: |-
      var nums = new[] { 10, 15, 20, 25 };
      var evens = nums.___(n => n % 2 == 0);
    answer:
      - Where
    explanation: Where metodi berilgan predikat (shart) true boʻlgan elementlarni tanlab oladi (JavaScript'dagi filter).
  - id: cs-linq-004
    type: output
    difficulty: 2
    lang: csharp
    prompt: Konsolga nima chiqadi?
    code: |-
      using System;
      using System.Linq;

      int[] nums = { 5, 8, 12, 20 };
      int first = nums.FirstOrDefault(n => n > 10);
      Console.Write(first);
    answer: "12"
    explanation: FirstOrDefault shartga mos keluvchi birinchi elementni qaytaradi. 10 dan katta birinchi son 12 dir.
  - id: cs-linq-005
    type: output
    difficulty: 2
    lang: csharp
    prompt: Konsolga nima chiqadi?
    code: |-
      using System;
      using System.Linq;

      int[] empty = { };
      int val = empty.FirstOrDefault();
      Console.Write(val);
    answer: "0"
    explanation: Agar toʻplam boʻsh boʻlsa, int tipining default qiymati (0) qaytadi.
  - id: cs-linq-006
    type: choice
    difficulty: 2
    lang: csharp
    prompt: Toʻplamda shartga mos keluvchi kamida bitta element bor-yoʻqligini tekshirib boolean qaytaruvchi metod qaysi?
    options:
      - Any()
      - All()
      - Some()
      - Has()
    answer: 0
    explanation: Any() metodi shartga mos kamida bitta element topsa true qaytaradi. All() esa hamma elementlar shartga mos kelishini talab qiladi.
  - id: cs-linq-007
    type: fill
    difficulty: 2
    lang: csharp
    prompt: LINQ soʻrovini darhol xotiraga yuklab, List<T> roʻyxatiga aylantirish metodini toʻldiring.
    code: |-
      var query = numbers.Where(n => n > 0);
      var list = query.___();
    answer:
      - ToList
    explanation: LINQ standart holda kechiktirilgan bajarilishga (deferred execution) ega. ToList() yoki ToArray() chaqirilganda soʻrov darhol hisoblanadi.
  - id: cs-linq-008
    type: order
    difficulty: 2
    lang: csharp
    prompt: LINQ yordamida faol foydalanuvchilarni filtrlash, ularning ismlarini olish, ismlarni uzunligi boʻyicha saralash va roʻyxatga aylantirish tartibini tiklang.
    lines:
      - var users = GetUsers();
      - var names = users
      - "    .Where(u => u.IsActive)"
      - "    .Select(u => u.Name)"
      - "    .OrderBy(name => name.Length)"
      - "    .ToList();"
    explanation: Foydalanuvchilar olinadi, Where bilan faollari filtrlanadi (IsActive faqat User obyektida bor), Select bilan ismlari olinadi, OrderBy bilan ismlar uzunligi boʻyicha saralanadi (Length faqat string da bor) va ToList() bilan yakunlanadi.
  - id: cs-linq-009
    type: choice
    difficulty: 3
    lang: csharp
    prompt: Ichma-ich joylashgan toʻplamlarni (masalan, roʻyxatlar roʻyxatini) bitta yagona tekis roʻyxatga (flatten) aylantirish uchun qaysi metod ishlatiladi?
    options:
      - SelectMany
      - Select
      - Flatten
      - Concat
    answer: 0
    explanation: SelectMany har bir element ichidagi toʻplamlarni ochib, bitta tekis ketma-ketlikka birlashtiradi.
  - id: cs-linq-010
    type: output
    difficulty: 3
    lang: csharp
    prompt: Konsolga nima chiqadi?
    code: |-
      using System;
      using System.Linq;

      int[] nums = { 1, 2, 3, 4 };
      int sum = nums.Aggregate(0, (acc, n) => acc + n);
      Console.Write(sum);
    answer: "10"
    explanation: Aggregate toʻplam elementlarini bitta qiymatga yigʻadi (boshlangʻich 0 + 1 + 2 + 3 + 4 = 10).
