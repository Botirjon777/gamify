exercises:
  - id: js-obj-001
    type: output
    difficulty: 1
    lang: js
    prompt: Konsolga nima chiqadi?
    code: |-
      const user = { name: "Anvar", age: 24 };
      const { name } = user;
      console.log(name);
    answer: Anvar
    explanation: Obyekt destrukturizatsiyasi orqali kalit nomiga mos oʻzgaruvchi osonlik bilan ajratib olinadi.
  - id: js-obj-002
    type: output
    difficulty: 1
    lang: js
    prompt: Konsolga nima chiqadi?
    code: |-
      const a = [1, 2];
      const b = [...a, 3, 4];
      console.log(b.length);
    answer: "4"
    explanation: Spread (...) operatori massiv elementlarini yoyib chiqadi, natijada [1, 2, 3, 4] hosil boʻlib, uzunligi 4 ga teng boʻladi.
  - id: js-obj-003
    type: fill
    difficulty: 1
    lang: js
    prompt: person.info null boʻlsa ham xatolik bermasdan undefined chiqishi uchun optional chaining operatorini toʻldiring.
    code: |-
      const person = { info: null };
      console.log(person.info___city);
    answer:
      - ?.
    explanation: Optional chaining (?.) chap tomondagi qiymat (person.info) null yoki undefined boʻlsa, xususiyatga murojaat qilmasdan darhol undefined qaytaradi. Oddiy nuqta (.) bu holda TypeError beradi.
  - id: js-obj-004
    type: output
    difficulty: 2
    lang: js
    prompt: Konsolga nima chiqadi?
    code: |-
      const count = 0;
      const res = count ?? 10;
      console.log(res);
    answer: "0"
    explanation: Nullish coalescing (??) faqat null yoki undefined boʻlgandagina oʻng tomondagi qiymatni oladi. 0 falsy boʻlsa ham saqlanib qoladi.
  - id: js-obj-005
    type: output
    difficulty: 2
    lang: js
    prompt: Konsolga nima chiqadi?
    code: |-
      const user = { name: "Botir" };
      const { name: username, role = "student" } = user;
      console.log(username + " " + role);
    answer: Botir student
    explanation: 'name: username nomi orqali oʻzgaruvchiga yangi nom berildi, role mavjud boʻlmagani sababli default qiymat "student" olindi.'
  - id: js-obj-006
    type: fill
    difficulty: 2
    lang: js
    prompt: Rest operatori yordamida qolgan barcha argumentlarni massiv koʻrinishida qabul qilish uchun operatorni toʻldiring.
    code: |-
      function sum(first, ___rest) {
        return first + rest.reduce((a, b) => a + b, 0);
      }
      console.log(sum(10, 20, 30));
    answer:
      - ...
    explanation: Rest parametri (...rest) funksiyaga berilgan qolgan barcha argumentlarni massivga yigʻib beradi.
  - id: js-obj-007
    type: output
    difficulty: 2
    lang: js
    prompt: Konsolga nima chiqadi?
    code: |-
      const obj1 = { a: 1, b: 2 };
      const obj2 = { b: 99, c: 3 };
      const merged = { ...obj1, ...obj2 };
      console.log(merged.b);
    answer: "99"
    explanation: "Obyektlar spread bilan birlashtirilganda, keyinroq kelgan obyektning kaliti (b: 99) avvalgisining ustiga yoziladi (overwrite)."
  - id: js-obj-008
    type: choice
    difficulty: 2
    lang: js
    prompt: Qaysi metod obyektning faqat kalitlari (keys) massivini qaytaradi?
    options:
      - Object.keys(obj)
      - Object.values(obj)
      - Object.entries(obj)
      - obj.getKeys()
    answer: 0
    explanation: Object.keys() obyektning barcha xususiyat nomlarini (kalitlarini) satrlar massivi koʻrinishida qaytaradi.
  - id: js-obj-009
    type: output
    difficulty: 3
    lang: js
    prompt: Konsolga nima chiqadi?
    code: |-
      const [head, ...tail] = [10, 20, 30, 40];
      console.log(tail.length);
    answer: "3"
    explanation: Massiv destrukturizatsiyasida head 10 qiymatini oladi, qolgan [20, 30, 40] esa tail massiviga tushadi va uning uzunligi 3 ga teng.
  - id: js-obj-010
    type: choice
    difficulty: 3
    lang: js
    prompt: Object.freeze(obj) va Object.seal(obj) oʻrtasidagi asosiy farq nima?
    options:
      - freeze mavjud xususiyatlarni oʻzgartirishga ham yoʻl qoʻymaydi (read-only), seal esa mavjud xususiyatlar qiymatini oʻzgartirishga ruxsat beradi
      - seal toʻliq muzlatadi, freeze esa yangi kalit qoʻshishga ruxsat beradi
      - Ikkalasi aynan bir xil ishlaydi
      - freeze faqat massivlar uchun, seal esa obyektlar uchun ishlatiladi
    answer: 0
    explanation: Object.freeze obyektni mutlaqo oʻzgarmas qiladi. Object.seal yangi xususiyat qoʻshish yoki oʻchirishni taqiqlaydi, ammo mavjud xususiyatlarning qiymatini oʻzgartirishga ruxsat beradi.
