exercises:
  - id: fractions-decimals-001
    type: choice
    difficulty: 1
    lang: text
    prompt: 1/2 kasrga teng boʻlgan kasrni toping.
    options:
      - 2/4
      - 1/3
      - 2/3
      - 3/4
    answer: 0
    explanation: 2/4 kasrning surat va maxrajini 2 ga qisqartirsak, 1/2 hosil boʻladi.
  - id: fractions-decimals-002
    type: choice
    difficulty: 1
    lang: text
    prompt: 3/5 kasrning maxraji nechaga teng?
    options:
      - "3"
      - "5"
      - "8"
      - "2"
    answer: 1
    explanation: Kasr chizigʻining ostidagi son maxraj deyiladi. 3/5 kasrda maxraj 5, surat esa 3.
  - id: fractions-decimals-003
    type: fill
    difficulty: 1
    lang: text
    prompt: "Boʻsh joylarni toʻldiring:"
    code: Kasr chizigʻining ustidagi son ___ deb, ostidagi son esa ___ deb ataladi.
    answer:
      - surat
      - maxraj
    bank:
      - boʻlinma
      - koʻpaytma
    explanation: Surat nechta ulush olinganini, maxraj esa butun nechta teng ulushga boʻlinganini koʻrsatadi.
  - id: fractions-decimals-004
    type: choice
    difficulty: 1
    lang: text
    prompt: Qaysi kasr eng katta?
    options:
      - 1/4
      - 1/3
      - 1/2
      - 1/5
    answer: 2
    explanation: Suratlari bir xil boʻlgan kasrlardan maxraji kichigi katta boʻladi, shuning uchun 1/2 eng katta.
  - id: fractions-decimals-005
    type: output
    difficulty: 1
    lang: text
    prompt: Kasrlarni qoʻshing va natijani kasr koʻrinishida yozing.
    code: 1/5 + 2/5
    answer:
      - 3/5
      - 0,6
      - "0.6"
    explanation: Maxrajlari bir xil kasrlarni qoʻshishda suratlar qoʻshiladi, maxraj oʻzgarmaydi. (1 + 2)/5 = 3/5.
  - id: fractions-decimals-006
    type: choice
    difficulty: 1
    lang: text
    prompt: 0,5 oʻnli kasri qaysi oddiy kasrga teng?
    options:
      - 1/5
      - 5/100
      - 1/4
      - 1/2
    answer: 3
    explanation: 0,5 = 5/10 = 1/2.
  - id: fractions-decimals-007
    type: choice
    difficulty: 1
    lang: text
    prompt: 0,3 + 0,4 yigʻindisi nechaga teng?
    options:
      - 0,7
      - 0,07
      - "7"
      - 0,12
    answer: 0
    explanation: Oʻndan 3 ga oʻndan 4 ni qoʻshsak, oʻndan 7 boʻladi. 0,3 + 0,4 = 0,7.
  - id: fractions-decimals-008
    type: choice
    difficulty: 2
    lang: text
    prompt: 6/8 kasrni qisqartiring.
    options:
      - 2/3
      - 3/4
      - 3/5
      - 1/2
    answer: 1
    explanation: Surat va maxrajni 2 ga boʻlamiz, 6/8 = 3/4.
  - id: fractions-decimals-009
    type: choice
    difficulty: 2
    lang: text
    prompt: 1/2 + 1/3 yigʻindisini toping.
    options:
      - 2/5
      - 1/6
      - 5/6
      - 2/6
    answer: 2
    explanation: Umumiy maxraj 6 ga keltiramiz, 1/2 = 3/6 va 1/3 = 2/6. 3/6 + 2/6 = 5/6.
  - id: fractions-decimals-010
    type: output
    difficulty: 2
    lang: text
    prompt: Hisoblang va natijani oʻnli kasr koʻrinishida yozing.
    code: 1,5 + 2,75
    answer:
      - 4,25
      - "4.25"
    explanation: Vergullarni bir-birining ostiga yozib qoʻshamiz, 1,50 + 2,75 = 4,25.
  - id: fractions-decimals-011
    type: order
    difficulty: 2
    lang: text
    prompt: "Kasrlarni oʻsish tartibida (kichigidan kattasiga) joylashtiring:"
    lines:
      - 1/8
      - 1/4
      - 1/2
      - 3/4
      - 7/8
    explanation: Umumiy maxraj 8 ga keltirsak, 1/8, 2/8, 4/8, 6/8, 7/8 hosil boʻladi.
  - id: fractions-decimals-012
    type: choice
    difficulty: 2
    lang: text
    prompt: 2/3 * 3/4 koʻpaytmasini toping.
    options:
      - 5/7
      - 6/7
      - 8/9
      - 1/2
    answer: 3
    explanation: Suratlar oʻzaro, maxrajlar oʻzaro koʻpaytiriladi, (2 * 3)/(3 * 4) = 6/12 = 1/2.
  - id: fractions-decimals-013
    type: fill
    difficulty: 2
    lang: text
    prompt: "Boʻsh joylarni toʻldiring:"
    code: 7/2 notoʻgʻri kasrini aralash son koʻrinishida yozsak, butun qismi ___ ga, kasr qismi esa ___ ga teng boʻladi.
    answer:
      - "3"
      - 1/2
    bank:
      - 1/7
      - "2"
      - "7"
    explanation: 7 ni 2 ga boʻlsak, boʻlinma 3, qoldiq 1 chiqadi. Demak, 7/2 = 3 butun 1/2.
  - id: fractions-decimals-014
    type: choice
    difficulty: 2
    lang: text
    prompt: 2,5 * 4 koʻpaytmasi nechaga teng?
    options:
      - "10"
      - "8"
      - "100"
      - 6,5
    answer: 0
    explanation: 2,5 * 4 = 2 * 4 + 0,5 * 4 = 8 + 2 = 10.
  - id: fractions-decimals-015
    type: choice
    difficulty: 2
    lang: text
    prompt: 1,2 - 0,45 ayirmasini toping.
    options:
      - 0,85
      - 0,75
      - 1,65
      - 0,65
    answer: 1
    explanation: 1,20 - 0,45 = 0,75.
  - id: fractions-decimals-016
    type: choice
    difficulty: 3
    lang: text
    prompt: 3/4 - 1/6 ayirmasini toping.
    options:
      - 1/3
      - 11/12
      - 7/12
      - 5/12
    answer: 2
    explanation: Umumiy maxraj 12 ga keltiramiz, 3/4 = 9/12 va 1/6 = 2/12. 9/12 - 2/12 = 7/12.
  - id: fractions-decimals-017
    type: output
    difficulty: 3
    lang: text
    prompt: Hisoblang va natijani oʻnli kasr koʻrinishida yozing.
    code: 0,6 * 0,25
    answer:
      - 0,15
      - "0.15"
      - 3/20
    explanation: 6 * 25 = 150, koʻpaytuvchilarda verguldan keyin jami 3 ta xona bor, shuning uchun 0,150 = 0,15.
  - id: fractions-decimals-018
    type: order
    difficulty: 3
    lang: text
    prompt: "2/3 + 1/4 yigʻindisini hisoblash bosqichlarini toʻgʻri tartibda joylashtiring:"
    lines:
      - "Umumiy maxrajni topamiz: 12"
      - "Kasrlarni umumiy maxrajga keltiramiz: 8/12 va 3/12"
      - "Suratlarni qoʻshamiz: 8 + 3 = 11"
      - "Javobni yozamiz: 11/12"
    explanation: 2/3 = 8/12 va 1/4 = 3/12, shuning uchun 2/3 + 1/4 = 11/12.
  - id: fractions-decimals-019
    type: choice
    difficulty: 3
    lang: text
    prompt: 3/5 ni 9/10 ga boʻling.
    options:
      - 27/50
      - 3/2
      - 1/3
      - 2/3
    answer: 3
    explanation: Kasrga boʻlish uchun uning teskarisiga koʻpaytiramiz, 3/5 * 10/9 = 30/45 = 2/3.
  - id: fractions-decimals-020
    type: output
    difficulty: 3
    lang: text
    prompt: Oddiy kasrni oʻnli kasr koʻrinishida yozing.
    code: 3/8
    answer:
      - 0,375
      - "0.375"
    explanation: 3 ni 8 ga boʻlamiz, 3 / 8 = 0,375.
