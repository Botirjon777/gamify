exercises:
  - id: powers-roots-001
    type: choice
    difficulty: 1
    lang: text
    prompt: 2^3 ning qiymati nechaga teng?
    options:
      - "8"
      - "6"
      - "9"
      - "5"
    answer: 0
    explanation: 2^3 = 2 * 2 * 2 = 8.
  - id: powers-roots-002
    type: choice
    difficulty: 1
    lang: text
    prompt: 3 * 3 * 3 * 3 * 3 koʻpaytmasi daraja koʻrinishida qanday yoziladi?
    options:
      - 5^3
      - 3^5
      - 3 * 5
      - 3^3
    answer: 1
    explanation: Koʻpaytuvchi 3 soni 5 marta takrorlanadi, shuning uchun asos 3, koʻrsatkich 5 boʻladi, yaʼni 3^5.
  - id: powers-roots-003
    type: fill
    difficulty: 1
    lang: text
    prompt: "Boʻsh joylarni toʻldiring:"
    code: 3^4 yozuvida 3 soni darajaning ___ deb, 4 soni esa darajaning ___ deb ataladi.
    answer:
      - asosi
      - koʻrsatkichi
    bank:
      - ildizi
      - koʻpaytmasi
    explanation: Asos — oʻz-oʻziga koʻpaytiriladigan son, koʻrsatkich esa u necha marta koʻpaytuvchi sifatida olinishini bildiradi.
  - id: powers-roots-004
    type: choice
    difficulty: 1
    lang: text
    prompt: √81 nechaga teng?
    options:
      - "8"
      - "7"
      - "9"
      - "18"
    answer: 2
    explanation: 9 * 9 = 81, shuning uchun √81 = 9.
  - id: powers-roots-005
    type: output
    difficulty: 1
    lang: text
    prompt: Hisoblang.
    code: 10^3
    answer:
      - "1000"
      - 1 000
    explanation: 10^3 = 10 * 10 * 10 = 1000.
  - id: powers-roots-006
    type: choice
    difficulty: 1
    lang: text
    prompt: 7^0 nechaga teng?
    options:
      - "0"
      - "7"
      - 1/7
      - "1"
    answer: 3
    explanation: Noldan farqli har qanday sonning nolinchi darajasi 1 ga teng, 7^0 = 1.
  - id: powers-roots-007
    type: choice
    difficulty: 1
    lang: text
    prompt: Qaysi sonning kvadrat ildizi butun son boʻladi?
    options:
      - "64"
      - "50"
      - "72"
      - "90"
    answer: 0
    explanation: 8 * 8 = 64, shuning uchun √64 = 8. 50, 72 va 90 esa hech qaysi butun sonning kvadrati emas.
  - id: powers-roots-008
    type: choice
    difficulty: 2
    lang: text
    prompt: Qaysi ifodaning qiymati eng katta?
    options:
      - 5^2
      - 2^5
      - 3^3
      - 4^2
    answer: 1
    explanation: 5^2 = 25, 2^5 = 32, 3^3 = 27, 4^2 = 16. Eng kattasi 2^5 = 32.
  - id: powers-roots-009
    type: choice
    difficulty: 2
    lang: text
    prompt: 2^3 * 2^4 ifodasini daraja koʻrinishida yozing.
    options:
      - 2^12
      - 4^7
      - 2^7
      - 4^12
    answer: 2
    explanation: Bir xil asosli darajalarni koʻpaytirganda koʻrsatkichlar qoʻshiladi, 2^(3 + 4) = 2^7.
  - id: powers-roots-010
    type: output
    difficulty: 2
    lang: text
    prompt: Hisoblang.
    code: 3^4
    answer: "81"
    explanation: 3^4 = 3 * 3 * 3 * 3 = 9 * 9 = 81.
  - id: powers-roots-011
    type: choice
    difficulty: 2
    lang: text
    prompt: √30 qaysi ikki ketma-ket butun son orasida joylashgan?
    options:
      - 4 va 5
      - 6 va 7
      - 15 va 16
      - 5 va 6
    answer: 3
    explanation: 5^2 = 25 va 6^2 = 36, 25 < 30 < 36, demak 5 < √30 < 6.
  - id: powers-roots-012
    type: fill
    difficulty: 2
    lang: text
    prompt: "Qoidani toʻldiring:"
    code: Bir xil asosli darajalarni koʻpaytirganda koʻrsatkichlar ___, boʻlganda esa ___.
    answer:
      - qoʻshiladi
      - ayiriladi
    bank:
      - boʻlinadi
      - koʻpaytiriladi
    explanation: a^m * a^n = a^(m + n) va a^m / a^n = a^(m - n).
  - id: powers-roots-013
    type: order
    difficulty: 2
    lang: text
    prompt: "Ifodalarni qiymati oʻsish tartibida (kichigidan kattasiga) joylashtiring:"
    lines:
      - 2^0
      - √9
      - 2^2
      - 3^2
      - 2^4
      - 5^2
    explanation: Qiymatlari mos ravishda 1, 3, 4, 9, 16 va 25 ga teng.
  - id: powers-roots-014
    type: choice
    difficulty: 2
    lang: text
    prompt: (-3)^2 nechaga teng?
    options:
      - "9"
      - "-9"
      - "6"
      - "-6"
    answer: 0
    explanation: (-3)^2 = (-3) * (-3) = 9, chunki ikkita manfiy sonning koʻpaytmasi musbat.
  - id: powers-roots-015
    type: choice
    difficulty: 2
    lang: text
    prompt: 5^6 / 5^4 nechaga teng?
    options:
      - "5"
      - "25"
      - "10"
      - "125"
    answer: 1
    explanation: Bir xil asosli darajalarni boʻlganda koʻrsatkichlar ayiriladi, 5^(6 - 4) = 5^2 = 25.
  - id: powers-roots-016
    type: choice
    difficulty: 3
    lang: text
    prompt: (2^3)^2 nechaga teng?
    options:
      - "32"
      - "12"
      - "64"
      - "36"
    answer: 2
    explanation: Darajani darajaga koʻtarganda koʻrsatkichlar koʻpaytiriladi, 2^(3 * 2) = 2^6 = 64.
  - id: powers-roots-017
    type: output
    difficulty: 3
    lang: text
    prompt: Hisoblang.
    code: √(3^2 + 4^2)
    answer: "5"
    explanation: 3^2 + 4^2 = 9 + 16 = 25, √25 = 5.
  - id: powers-roots-018
    type: order
    difficulty: 3
    lang: text
    prompt: "(2^5 * 2^3) / 2^6 ifodasini soddalashtirish bosqichlarini toʻgʻri tartibda joylashtiring:"
    lines:
      - (2^5 * 2^3) / 2^6
      - 2^(5 + 3) / 2^6
      - 2^8 / 2^6
      - 2^(8 - 6)
      - 2^2
      - "4"
    explanation: Koʻpaytirishda koʻrsatkichlar qoʻshiladi, boʻlishda ayiriladi. Natijada 2^2 = 4 hosil boʻladi.
  - id: powers-roots-019
    type: choice
    difficulty: 3
    lang: text
    prompt: 2^(-2) nechaga teng?
    options:
      - "-4"
      - 1/2
      - -1/4
      - 1/4
    answer: 3
    explanation: Manfiy koʻrsatkichli daraja teskari sonni bildiradi, 2^(-2) = 1/2^2 = 1/4.
  - id: powers-roots-020
    type: output
    difficulty: 3
    lang: text
    prompt: Hisoblang.
    code: √50 * √2
    answer: "10"
    explanation: Ildizlar koʻpaytmasi koʻpaytmaning ildiziga teng, √50 * √2 = √100 = 10.
