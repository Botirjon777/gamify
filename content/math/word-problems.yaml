exercises:
  - id: word-problems-001
    type: choice
    difficulty: 1
    lang: text
    prompt: Alida 12 ta olma bor edi. U 5 tasini doʻstiga berdi. Alida nechta olma qoldi?
    options:
      - "7"
      - "17"
      - "8"
      - "6"
    answer: 0
    explanation: Berilgan olmalar ayiriladi, 12 - 5 = 7.
  - id: word-problems-002
    type: choice
    difficulty: 1
    lang: text
    prompt: Bir qutida 6 ta qalam bor. 4 ta shunday qutida nechta qalam bor?
    options:
      - "10"
      - "24"
      - "20"
      - "28"
    answer: 1
    explanation: Bir qutidagi qalamlar soni qutilar soniga koʻpaytiriladi, 6 * 4 = 24.
  - id: word-problems-003
    type: choice
    difficulty: 1
    lang: text
    prompt: Anvar 9 yoshda. Akasi undan 5 yosh katta. Akasi necha yoshda?
    options:
      - "4"
      - "45"
      - "14"
      - "13"
    answer: 2
    explanation: «5 yosh katta» degani qoʻshishni bildiradi, 9 + 5 = 14.
  - id: word-problems-004
    type: output
    difficulty: 1
    lang: text
    prompt: Masalani yeching va javobni son bilan yozing.
    code: Doʻkonda bir kilogramm olma 8 000 soʻm turadi. 3 kilogramm olma necha soʻm turadi?
    answer:
      - "24000"
      - 24 000
    explanation: Narx miqdorga koʻpaytiriladi, 8 000 * 3 = 24 000 soʻm.
  - id: word-problems-005
    type: fill
    difficulty: 1
    lang: text
    prompt: "Boʻsh joylarni toʻldiring:"
    code: Sinfda 14 ta oʻgʻil bola va 11 ta qiz bor. Jami oʻquvchilar soni ___ ta, oʻgʻil bolalar qizlardan ___ ta koʻp.
    answer:
      - "25"
      - "3"
    bank:
      - "15"
      - "24"
      - "4"
    explanation: Jami 14 + 11 = 25 ta oʻquvchi. Farqi 14 - 11 = 3 ta.
  - id: word-problems-006
    type: choice
    difficulty: 1
    lang: text
    prompt: 24 ta konfetni 4 nafar bolaga teng boʻlib berishdi. Har bir bola nechtadan konfet oldi?
    options:
      - "8"
      - "20"
      - "4"
      - "6"
    answer: 3
    explanation: Teng boʻlish uchun boʻlish amali bajariladi, 24 / 4 = 6.
  - id: word-problems-007
    type: choice
    difficulty: 1
    lang: text
    prompt: Avtobusda 30 nafar yoʻlovchi bor edi. Bekatda 8 kishi tushib, 5 kishi mindi. Avtobusda necha yoʻlovchi boʻldi?
    options:
      - "27"
      - "33"
      - "17"
      - "43"
    answer: 0
    explanation: Tushganlar ayiriladi, minganlar qoʻshiladi, 30 - 8 + 5 = 27.
  - id: word-problems-008
    type: choice
    difficulty: 2
    lang: text
    prompt: Mashina 60 km/soat tezlik bilan 3 soat yurdi. U qancha masofani bosib oʻtdi?
    options:
      - 20 km
      - 180 km
      - 63 km
      - 120 km
    answer: 1
    explanation: Masofa tezlik bilan vaqtning koʻpaytmasiga teng, 60 * 3 = 180 km.
  - id: word-problems-009
    type: choice
    difficulty: 2
    lang: text
    prompt: Poyezd 60 km/soat tezlik bilan yurib, 240 km masofani necha soatda bosib oʻtadi?
    options:
      - 3 soat
      - 6 soat
      - 4 soat
      - 180 soat
    answer: 2
    explanation: Vaqt masofani tezlikka boʻlish orqali topiladi, 240 / 60 = 4 soat.
  - id: word-problems-010
    type: output
    difficulty: 2
    lang: text
    prompt: Masalani yeching va javobni son bilan yozing.
    code: Bir daftar 3 500 soʻm, bir ruchka 2 000 soʻm turadi. 4 ta daftar va 2 ta ruchka uchun jami necha soʻm toʻlanadi?
    answer:
      - "18000"
      - 18 000
    explanation: Daftarlar uchun 3 500 * 4 = 14 000 soʻm, ruchkalar uchun 2 000 * 2 = 4 000 soʻm. Jami 14 000 + 4 000 = 18 000 soʻm.
  - id: word-problems-011
    type: choice
    difficulty: 2
    lang: text
    prompt: Ota 40 yoshda, oʻgʻli esa undan 4 marta kichik. Oʻgʻli necha yoshda?
    options:
      - "36"
      - "44"
      - "160"
      - "10"
    answer: 3
    explanation: «4 marta kichik» degani 4 ga boʻlishni bildiradi, 40 / 4 = 10.
  - id: word-problems-012
    type: order
    difficulty: 2
    lang: text
    prompt: "3 ta daftar 9 000 soʻm turadi. 7 ta shunday daftar qancha turishini topish bosqichlarini toʻgʻri tartibda joylashtiring:"
    lines:
      - "Bitta daftarning narxini topamiz: 9 000 / 3"
      - Bitta daftar 3 000 soʻm turishini aniqlaymiz
      - "Narxni daftarlar soniga koʻpaytiramiz: 3 000 * 7"
      - "Javobni yozamiz: 21 000 soʻm"
    explanation: Bitta daftar 9 000 / 3 = 3 000 soʻm, 7 ta daftar esa 3 000 * 7 = 21 000 soʻm turadi.
  - id: word-problems-013
    type: choice
    difficulty: 2
    lang: text
    prompt: Ikki sonning yigʻindisi 50 ga teng, ulardan biri ikkinchisidan 10 ga katta. Katta sonni toping.
    options:
      - "30"
      - "20"
      - "40"
      - "25"
    answer: 0
    explanation: Kichik son x boʻlsa, x + (x + 10) = 50, 2x = 40, x = 20. Katta son 20 + 10 = 30.
  - id: word-problems-014
    type: fill
    difficulty: 2
    lang: text
    prompt: "Boʻsh joylarni toʻldiring:"
    code: Velosipedchi 2 soatda 30 km yoʻl bosdi. Uning tezligi ___ km/soat, shu tezlikda u 5 soatda ___ km yoʻl bosadi.
    answer:
      - "15"
      - "75"
    bank:
      - "10"
      - "150"
      - "60"
    explanation: Tezlik 30 / 2 = 15 km/soat. 5 soatda 15 * 5 = 75 km yoʻl bosadi.
  - id: word-problems-015
    type: choice
    difficulty: 2
    lang: text
    prompt: 5 nafar ishchi bir ishni 12 kunda bajaradi. Xuddi shunday unum bilan ishlaydigan 10 nafar ishchi shu ishni necha kunda bajaradi?
    options:
      - "24"
      - "6"
      - "7"
      - "10"
    answer: 1
    explanation: Ish hajmi 5 * 12 = 60 ishchi-kun. 10 nafar ishchi uni 60 / 10 = 6 kunda bajaradi.
  - id: word-problems-016
    type: choice
    difficulty: 3
    lang: text
    prompt: Ona 32 yoshda, qizi 8 yoshda. Necha yildan keyin ona qizidan 3 marta katta boʻladi?
    options:
      - "2"
      - "6"
      - "4"
      - "8"
    answer: 2
    explanation: x yildan keyin ona 32 + x, qizi 8 + x yoshda boʻladi. 32 + x = 3(8 + x), 32 + x = 24 + 3x, 2x = 8, x = 4. Tekshirish, 36 = 3 * 12.
  - id: word-problems-017
    type: output
    difficulty: 3
    lang: text
    prompt: Masalani yeching va javobni son bilan yozing.
    code: Ikki shahar orasidagi masofa 300 km. Ikki mashina bir vaqtda bir-biriga qarab yoʻlga chiqdi. Birining tezligi 70 km/soat, ikkinchisiniki 80 km/soat. Ular necha soatdan keyin uchrashadi?
    answer: "2"
    explanation: Yaqinlashish tezligi 70 + 80 = 150 km/soat. Uchrashuv vaqti 300 / 150 = 2 soat.
  - id: word-problems-018
    type: order
    difficulty: 3
    lang: text
    prompt: "Bir son oʻylandi. Uni 3 ga koʻpaytirib, 7 qoʻshilganda 31 hosil boʻldi. Oʻylangan sonni topish bosqichlarini toʻgʻri tartibda joylashtiring:"
    lines:
      - Oʻylangan sonni x deb belgilaymiz
      - "Tenglama tuzamiz: 3x + 7 = 31"
      - "7 ni oʻng tomonga oʻtkazamiz: 3x = 24"
      - "Ikkala tomonni 3 ga boʻlamiz: x = 8"
    explanation: 3x + 7 = 31 tenglamadan 3x = 24, x = 8. Tekshirish, 3 * 8 + 7 = 31.
  - id: word-problems-019
    type: choice
    difficulty: 3
    lang: text
    prompt: Hovuzni birinchi quvur 6 soatda, ikkinchi quvur 3 soatda toʻldiradi. Ikkala quvur birga ochilsa, hovuz necha soatda toʻladi?
    options:
      - 9 soat
      - 4,5 soat
      - 3 soat
      - 2 soat
    answer: 3
    explanation: Bir soatda birinchi quvur hovuzning 1/6 qismini, ikkinchisi 1/3 qismini toʻldiradi. Birgalikda 1/6 + 1/3 = 1/2 qism, demak hovuz 2 soatda toʻladi.
  - id: word-problems-020
    type: output
    difficulty: 3
    lang: text
    prompt: Masalani yeching va javobni son bilan yozing.
    code: Fermada tovuqlar va quyonlar bor. Ularning boshlari soni 10 ta, oyoqlari soni 28 ta. Fermada nechta quyon bor?
    answer: "4"
    explanation: Hammasi tovuq boʻlganda oyoqlar 10 * 2 = 20 ta boʻlardi. Ortiqcha 28 - 20 = 8 ta oyoq quyonlarniki, har bir quyonda 2 ta ortiqcha oyoq bor, 8 / 2 = 4 ta quyon.
