exercises:
  - id: py-func-001
    type: output
    difficulty: 1
    lang: python
    prompt: Konsolga nima chiqadi?
    code: |-
      def greet(name="Doʻstim"):
        return f"Salom, {name}!"

      print(greet())
    answer: Salom, Doʻstim!
    explanation: Funksiya argumenti berilmaganda uning default qiymati ("Doʻstim") ishlatiladi.
  - id: py-func-002
    type: fill
    difficulty: 1
    lang: python
    prompt: Bir qatorli anonim funksiya yaratish uchun kalit soʻzni toʻldiring.
    code: |-
      square = ___ x: x ** 2
      print(square(5))
    answer:
      - lambda
    explanation: lambda kalit soʻzi yordamida kichik, nomsiz (anonim) funksiyalar yoziladi.
  - id: py-func-003
    type: choice
    difficulty: 1
    lang: python
    prompt: Funksiyaga ixtiyoriy sondagi pozitsion argumentlarni (positional arguments) tuple koʻrinishida qabul qilish uchun qaysi belgi ishlatiladi?
    options:
      - "*args"
      - "**kwargs"
      - "&args"
      - ...args
    answer: 0
    explanation: "*args barcha qoʻshimcha pozitsion argumentlarni tuple koʻrinishida yigʻib beradi."
  - id: py-func-004
    type: fill
    difficulty: 2
    lang: python
    prompt: Kalit-qiymat (keyword arguments) koʻrinishidagi ixtiyoriy argumentlarni qabul qilish prefiksini toʻldiring.
    code: |-
      def show_info(___kwargs):
        print(kwargs.get("city"))

      show_info(city="Toshkent")
    answer:
      - "**"
    explanation: "**kwargs barcha kalitli argumentlarni lugʻat (dict) koʻrinishida qabul qiladi."
  - id: py-func-005
    type: output
    difficulty: 2
    lang: python
    prompt: Konsolga nima chiqadi?
    code: |-
      def multiply(a, b=2, c=1):
        return a * b * c

      print(multiply(3, c=3))
    answer: "18"
    explanation: a=3, b default 2 boʻlib qoladi, c esa kalitli argument sifatida 3 ga teng boʻladi. 3 * 2 * 3 = 18.
  - id: py-func-006
    type: choice
    difficulty: 2
    lang: python
    prompt: Funksiya kodini oʻzgartirmasdan, uni oʻrab olib qoʻshimcha logika qoʻshuvchi mexanizm nima deb ataladi?
    options:
      - Decorator (@)
      - Generator
      - Iterator
      - Metaclass
    answer: 0
    explanation: Decorator boshqa funksiyani argument sifatida qabul qilib, uning bajarilishidan oldin yoki keyin qoʻshimcha amallarni (loglash, vaqt oʻlchash, avtorizatsiya) bajaradi.
  - id: py-func-007
    type: output
    difficulty: 2
    lang: python
    prompt: Konsolga nima chiqadi?
    code: |-
      x = 5
      def change():
        global x
        x = 20

      change()
      print(x)
    answer: "20"
    explanation: global x kalit soʻzi funksiya ichida tashqi (global) x oʻzgaruvchisini oʻzgartirish imkonini beradi.
  - id: py-func-008
    type: order
    difficulty: 2
    lang: python
    prompt: Oddiy Python dekoratori tuzilishining toʻgʻri tartibini tiklang.
    lines:
      - "def my_decorator(func):"
      - "    def wrapper(*args, **kwargs):"
      - "        print('Funksiyadan oldin')"
      - "        res = func(*args, **kwargs)"
      - "        return res"
      - "    return wrapper"
    explanation: Dekorator funksiyani oladi, ichki wrapper funksiyasini eʼlon qilib qaytaradi.
  - id: py-func-009
    type: output
    difficulty: 3
    lang: python
    prompt: Konsolga nima chiqadi?
    code: |-
      def append_to(element, target=[]):
        target.append(element)
        return target

      append_to(1)
      print(append_to(2))
    answer: "[1, 2]"
    explanation: Python'da oʻzgaruvchan (mutable) default parametrlar (masalan target=[]) faqat funksiya eʼlon qilinganda bir marta yaratiladi va barcha chaqiriqlar orasida umumiy boʻlib qoladi.
  - id: py-func-010
    type: choice
    difficulty: 3
    lang: python
    prompt: Funksiya qiymat qaytarishda return oʻrniga yield kalit soʻzini ishlatsa, u nimaga aylanadi?
    options:
      - Generator funksiyaga
      - Asinxron funksiyaga
      - Lambda funksiyaga
      - Rekursiv funksiyaga
    answer: 0
    explanation: yield qiymatni chiqarib, funksiya holatini vaqtincha toʻxtatadi. Bunday funksiya chaqirilganda Generator obyekti hosil boʻladi.
