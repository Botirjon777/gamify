# Zukkolar — zukkolar.uz and study-center subdomains (*.zukkolar.uz). Traffic arrives via Cloudflare;
# /etc/nginx/conf.d/cloudflare-realip.conf restores the visitor IP. Shared settings: conf.d/hotels-common.conf.

upstream zukkolar_app { server 127.0.0.1:3010; keepalive 16; }

# HTTP → HTTPS (apex + subdomains)
server {
    listen 80; listen [::]:80;
    server_name zukkolar.uz www.zukkolar.uz *.zukkolar.uz;
    return 301 https://$host$request_uri;
}

# www → apex
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name www.zukkolar.uz;
    ssl_certificate /etc/ssl/zukkolar/zukkolar.uz.pem; ssl_certificate_key /etc/ssl/zukkolar/zukkolar.uz.key;
    return 301 https://zukkolar.uz$request_uri;
}

# App: apex = main platform, <slug>.zukkolar.uz = study center (resolved from Host in the app)
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name zukkolar.uz *.zukkolar.uz;
    ssl_certificate /etc/ssl/zukkolar/zukkolar.uz.pem; ssl_certificate_key /etc/ssl/zukkolar/zukkolar.uz.key;

    access_log /var/log/nginx/zukkolar.access.log;
    error_log  /var/log/nginx/zukkolar.error.log warn;

    # Hashed build assets never change — let Cloudflare and browsers cache them for a year.
    location /_next/static/ {
        proxy_pass http://zukkolar_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://zukkolar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
